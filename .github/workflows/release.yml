name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches plugin.json Version
        shell: pwsh
        run: |
          $version = (Get-Content plugin.json -Raw | ConvertFrom-Json).Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match plugin.json Version $version"
          }
      - name: Package plugin
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "BrightSync"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item plugin.json, main.py, brightsync_client.py, query_parser.py, icon.png, README.md -Destination $staging
          Compress-Archive -Path "$staging\*" -DestinationPath BrightSync.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME BrightSync.zip --title "BrightSync $env:GITHUB_REF_NAME" --generate-notes
